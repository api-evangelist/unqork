openapi: 3.2.0
info:
  version: 1.0.0
  x-logo:
    url: https://developers.unqork.io/unqork-logo.png
    backgroundColor: '#FFFFFF'
  title: Unqork Customer Groups API
  description: Unqork's customer REST API, based on open standards, allows you to set and retrieve module submission data, as well as control other aspects of your Unqork environment.
servers:
- url: https://{host}/api/1.0
  variables:
    host:
      default: env.unqork.io
      description: Environment host
security:
- OAuth2: []
tags:
- name: Groups
  description: The following endpoints are available to "Administrator" users only.
paths:
  /groups:
    get:
      tags:
      - Groups
      summary: Get Groups
      operationId: getGroups
      description: 'Returns group objects. This is a paged endpoint (see Paging).

        ### Authorization Required:

        - Designer Administrator'
      parameters:
      - name: limit
        in: query
        description: Maximum number of results to return (default 1000, maximum 1000)
        required: false
        schema:
          type: integer
          format: int32
          default: 1000
          maximum: 1000
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Groups
      summary: Create Group
      operationId: createGroup
      description: 'Creates a new group.

        ### Authorization Required:

        - Designer Administrator'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPost'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{groupName}:
    get:
      tags:
      - Groups
      summary: Get Group
      operationId: getGroup
      description: 'Returns a group object based on a group name.

        ### Authorization Required:

        - Designer Administrator'
      parameters:
      - name: groupName
        in: path
        description: Name of group to retrieve
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Groups
      summary: Update Group
      operationId: updateGroup
      description: 'Updates a single group. Partial updates are supported.

        ### Authorization Required:

        - Designer Administrator'
      parameters:
      - name: groupName
        in: path
        description: Name of group to update
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPut'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Groups
      summary: Delete Group
      operationId: deleteGroup
      description: 'Deletes a group based on the group name supplied. Note that groups are hard-deleted, and this is not reversible.

        ### Authorization Required:

        - Designer Administrator'
      parameters:
      - name: groupName
        in: path
        description: Name of group to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Group deleted
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    GroupPost:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          description: See Group Administration screen for definitions
          enum:
          - role_descendents
          - own_role_and_descendents
          - ignore_role
    Error:
      type: object
      description: Error
      required:
      - code
      - message
      properties:
        code:
          description: HTTP status code
          type: integer
          format: int32
          enum:
          - 400
          - 401
          - 403
          - 404
          - 412
          - 500
        message:
          description: Error message
          type: string
    GroupPut:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          description: See Group Administration screen for definitions
          enum:
          - role_descendents
          - own_role_and_descendents
          - ignore_role
    Group:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          description: See Group Administration screen for definitions
          enum:
          - role_descendents
          - own_role_and_descendents
          - ignore_role
  securitySchemes:
    OAuth2:
      description: "The Unqork API implements the [OAuth 2.0 Client Credentials Grant](https://datatracker.ietf.org/doc/html/rfc6749#section-1.3.4) and the [OAuth 2.0 Password Grant](https://tools.ietf.org/html/rfc6749#section-1.3.3). Access via OAuth2 Client Credentials Grant can be utilized by creating Client Credentials through the API Access Management Administration page. Access via OAuth2 Password Grant can be enabled for all users in Environment Administration. Once OAuth2 Password Grant is enabled, all Unqork users can use their Unqork username/password to retrieve an access token.\n\nIn order to utilize any of the API resources, you must first retrieve an access token by POSTing your credentials to the access token URL, e.g. using `curl`:\n```\n  $ curl -u '{clientId}:{clientSecret}' -X POST --basic https://xyzfinancial.unqork.io/api/1.0/oauth2/access_token -d \"grant_type=client_credentials\"\n```\nOr:\n```\n  $ curl -X POST https://xyzfinancial.unqork.io/api/1.0/oauth2/access_token -d \"grant_type=password&username={username}&password={password}\"\n```\nThis returns an \"access_token\", which you would then retain and use in any subsequent resource requests. **Access tokens expire after one hour, at which point you must retrieve a new one.** The access token should be included in a request header:\n```\n  $ curl -H \"Authorization: Bearer {access_token}\" https://xyzfinancial.unqork.io/api/1.0/{endpoint}\n```\n"
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://xyzfinancial.unqork.io/api/1.0/oauth2/access_token
          scopes:
            none: N/A
        password:
          tokenUrl: https://xyzfinancial.unqork.io/api/1.0/oauth2/access_token
          scopes:
            none: N/A
