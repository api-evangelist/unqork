description: >-
  Unqork publishes dated platform release notes in its Documentation Hub, one
  page per minor release plus a page per patch, alongside a forward-looking
  release calendar. Product announcements are additionally posted to the Creator
  Community's Updates channel. There is no separate API changelog — the REST
  surface at /api/1.0 is not independently versioned, so API-affecting changes
  arrive inside platform releases.

scheme: major.minor for GA releases, major.minor.patch.build for patches
