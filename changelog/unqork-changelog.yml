history_note: >-
  Release-note pages are retained back through the 7.x line (7.20.0–7.30.0,
  7.28.x, 7.26.x and earlier), each with its own patch series. Only the current
  window is captured here; the Documentation Hub is the source of truth.

gaps:
  - >-
    Release notes are not machine-readable — no feed, no JSON, one HTML page per
    release.
  - >-
    Entries are not labelled breaking vs additive at the changelog level, so a
    consumer cannot tell from the index whether a release affects the API.
  - >-
    No API-specific changelog. Because the REST path is frozen at /api/1.0, an
    API consumer has to read platform release notes to find contract changes.
