auth:
  type: oauth2
  grants: [client_credentials, password]
  token_url: https://{subdomain}.unqork.io/api/1.0/oauth2/access_token
  header: 'Authorization: Bearer {access_token}'
  token_lifetime: 1 hour
  note: >-
    Any MCP server for Unqork is inherently per-tenant: the subdomain is part of
    the base URL, and credentials are minted per environment in API Access
    Management with Express or Creator roles attached. A single hosted server
    could not serve all customers without per-tenant configuration.

