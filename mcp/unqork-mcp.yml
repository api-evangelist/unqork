excluded_from_candidate_surface:
  - operations: [credentialsCreate, credentialsUpdate, credentialsDeleteById, credentialsRevoke, generateReferString]
    reason: >-
      Credential and authentication-material management. Minting or revoking API
      client secrets from an agent tool is a privilege-escalation surface and
      should stay a human, audited administrative action.
  - operations: [promoteModule, promoteApplicationByItems, promoteDataCollection, promoteStyle, promoteGroups, promoteRoles]
    reason: >-
      Promotions move configuration into UAT and Production. Consequence is
      environment-wide and irreversible in practice; should require human
      approval rather than sit behind a tool call.
  - operations: [createUser, updateUser, deleteUser, createGroup, updateGroup, deleteGroup]
    reason: Identity and access administration; same escalation argument.
  - operations: [deleteModuleSubmissions, deleteWorkflowSubmissions, applicationsDeleteById]
    reason: >-
      Bulk and top-level destructive operations. `destroy=true` makes deletes
      permanent and unrecoverable.

agent_safety_notes:
  - >-
    NO IDEMPOTENCY. The Unqork API has no Idempotency-Key contract, so a retried
    create_submission call WILL create a duplicate record. Any MCP server for
    Unqork must dedupe on the client side or expose creates as confirm-first.
  - >-
    Rate limiting is per source IP per server in a 60-second window and is often
    tuned DOWN by administrators (as low as 100/min). A shared hosted MCP server
    would pool many agents behind one egress IP and exhaust the window.
  - >-
    Authorization is RBAC, not scopes. There is no way to mint a read-only token
    by scope — least privilege must be expressed by creating a credential bound
    to a narrow Express/Creator role.
  - >-
    Errors are `{code, message}` with no machine-readable error identifier, so an
    agent cannot reliably distinguish an expired token from a malformed one
    without string matching.
  - >-
    A per-tenant subdomain is required; there is no global api.unqork.com host.

