- aid: unqork:unqork-applications-api
  name: Unqork Applications API
  description: >-
    An application is the parent of a group of one or more elements. An application can be of either 'Module'
    (type is `form` in DB) or 'Workflow' type. 'Module' type application cannot have workflow but can
    have data collections. 'Workflow' type application can have both modules and data collections. There
    can be only a single workflow in an application.


    The following endpoints are available to "Administrator" users only.
