apis:
- name: Unqork Customer API
  description: 'Unqork''s customer-facing REST API, based on open standards, for setting and
    retrieving module submission data and controlling other aspects of an Unqork environment. 93
    operations across Submissions, Applications, Workflow, Modules, Promotions, Users, Groups,
    Transforms, Global Variables, Credentials, Revisions, Data Collections, Data Model Records,
    Search Configs, Logs and Query. All communication is over HTTPS with JSON responses; every
    request is authorized with an OAuth 2.0 bearer token.'
