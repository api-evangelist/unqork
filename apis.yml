- aid: unqork:unqork-transforms-api
  name: Unqork Transforms API
  description: >-
    The following endpoints are available to "Administrator" users only.

    Transforms should expect the following input data structure:


    ***NJK (in):***<br/> Input includes only the `data.rawData` part of the submission object.
      ```
      {
        "firstName": "Al"
      }
      ```


    ***NJK (out):***<br/> Input includes all of the top-level properties of the submission object, except
    `data` here refers to `data.rawData`.
      ```
      {
        "data": {
          "firstName": "Al"
        },
        "metadata": {},
        "created": "2018-01-01T00:00:00.000Z",
        ...
      }
      ```


    ***XML (out):***<br/> Input includes all of the top-level properties of the submission object, except
    `data` here refers to `data.rawData`.
      ```
      <submission>
        <data>
          <firstName>Al</firstName>
        </data>
        <metadata>
        </metadata>
        <created>2018-01-01T00:00:00.000Z</created>
        ...
      </submission>
      ```
  humanURL: https://developers.unqork.io/
  baseURL: https://training.unqork.io/api/1.0
  tags:
  - Transforms
