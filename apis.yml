aid: unqork
name: Unqork
description: 'Unqork is an enterprise application development platform — a no-code / "codeless"
  platform-as-a-service used by banks, insurers, healthcare organizations and government agencies to
  build and operate complex, regulated business applications without hand-written application code.
  Creators assemble applications from modules, workflows, components and data models in the Unqork
  Designer, and the platform exposes a REST Customer API (documented as OpenAPI 3.0.3 at
  developers.unqork.io) that lets external systems manage submissions, modules, applications,
  workflows, users, groups, promotions, transforms, global variables and API access credentials in an
  Unqork environment. The API is served per-tenant at https://{subdomain}.unqork.io/api/1.0, secured
  with OAuth 2.0 client-credentials and password grants issued through API Access Management, and the
  platform ships on a quarterly GA release cadence with weekly patch releases.'
