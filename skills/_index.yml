cross_cutting_rules:
  - >-
    No idempotency anywhere in the API — no Idempotency-Key, no If-Match, no
    ETag. Never blind-retry a write; correlate on submission metadata and read
    back first.
  - >-
    No OAuth scopes. Least privilege is a provisioning decision — create a
    credential bound to a narrow Express or Creator role.
  - >-
    Errors are {code, message} on application/json, not RFC 9457. 412 carries the
    structured validation/execution envelope and is the code to branch on.
  - >-
    Rate limits are per source IP per server per 60 seconds and are tuned by the
    customer's administrator (default 1000, documented minimum 100). Read
    x-ratelimit-remaining; there is no Retry-After.
  - >-
    Base URLs are per tenant and per environment. Credentials and tokens do not
    cross environments.
