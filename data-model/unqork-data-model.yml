  - {from: Workflow, to: TimedEvent, kind: has_many, via: submissionId,
     evidence: 'GET /workflows/{workflowPath}/timedEvents/{submissionId}'}
  - {from: User, to: Group, kind: has_many, via: groups,
     evidence: getUsers filter supports a `groups` field}
  - {from: User, to: Role, kind: has_many, via: applicationRoles,
     evidence: getUsers filter supports `role` and `applicationRoles` fields}
  - {from: Group, to: User, kind: has_many, via: groupName}
  - {from: Credential, to: Role, kind: has_many, via: roles,
     evidence: 'API Access Management requires at least one Express or Creator role per credential'}
  - {from: Promotion, to: Module, kind: references, via: moduleId}
  - {from: Promotion, to: Application, kind: references, via: applicationId}
