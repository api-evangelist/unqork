schema_reuse_graph:
  note: >-
    59 component schemas with a shallow $ref graph — the error/validation types
    are the only widely shared components.
  most_referenced:
    - {schema: ValidationErrors, referenced_by: 8}
    - {schema: MetadataRequest, referenced_by: 4}
    - {schema: ExecutionError, referenced_by: 3}
    - {schema: InvalidNavigationPanels, referenced_by: 3}
    - {schema: DataFilter, referenced_by: 3}
    - {schema: MetadataFilter, referenced_by: 3}

gaps:
  - >-
    Entity schemas are not cross-referenced. Submission responses do not $ref a
    Module or Application schema, so the containment hierarchy is expressed only
    in path structure, not in the type graph.
  - >-
    Role and Workspace have no first-class schema in the Customer API even though
    both are load-bearing concepts.
  - No id type prefixes, so ids are not self-describing.
